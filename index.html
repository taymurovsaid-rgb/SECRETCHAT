
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d71935">
  <title>SECRET CHAT</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #222222;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #d71935;
      color: white;
      min-height: 43vh;
      padding: 35px 22px 55px;
      text-align: center;
      border-radius: 0 0 35px 35px;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-top: 20px;
    }

    .online {
      display: inline-block;
      margin-top: 20px;
      padding: 7px 15px;
      border: 1px solid #ffffff88;
      border-radius: 30px;
      font-size: 12px;
    }

    .header h1 {
      font-size: 29px;
      line-height: 1.25;
      margin-top: 35px;
    }

    .header p {
      color: #ffe4e8;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: -28px auto 0;
      padding: 0 22px 35px;
      position: relative;
    }

    .card {
      background: white;
      border: 2px solid #d71935;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 25px #00000010;
    }

    .card-title {
      color: #d71935;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 17px 12px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 7px 0;
    }

    #find-partner {
      background: #d71935;
      color: white;
    }

    #stop-search {
      background: white;
      color: #d71935;
      border: 2px solid #d71935;
      display: none;
    }

    .secondary {
      background: #fff0f2;
      color: #c41430;
      border: 1px solid #f0b8c1;
    }

    #status {
      text-align: center;
      color: #d71935;
      min-height: 25px;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #999999;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">SECRET CHAT</div>
    <div class="online">● АНОНИМНОЕ ОБЩЕНИЕ</div>

    <h1>НАЙДИ НОВЫХ<br>СОБЕСЕДНИКОВ</h1>

    <p>Общайся свободно. Оставайся собой.</p>
  </header>

  <main>
    <section class="card">

      <div class="card-title">ТВОЙ АНОНИМНЫЙ ЧАТ</div>

      <button id="find-partner">
        🔍 НАЙТИ СОБЕСЕДНИКА
      </button>

      <button id="stop-search">
        ✖ ОСТАНОВИТЬ ПОИСК
      </button>

      <div id="status">
        Готов к новым знакомствам?
      </div>

    </section>

    <button class="secondary" onclick="profile()">
      👤 Моя анкета
    </button>

    <button class="secondary" onclick="about()">
      ℹ️ О приложении
    </button>

    <div class="footer">
      SECRET CHAT · ТВОЁ ПРОСТРАНСТВО ОБЩЕНИЯ
    </div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    tg?.ready();
    tg?.expand();

    function profile() {
      document.getElementById("status").textContent =
        "Раздел анкеты скоро появится.";
    }

    function about() {
      document.getElementById("status").textContent =
        "SECRET CHAT — анонимное общение.";
    }

    document.getElementById("find-partner").onclick = function() {
      document.getElementById("status").textContent =
        "Система поиска собеседников пока подключается.";
    };

    document.getElementById("stop-search").onclick = function() {
      document.getElementById("status").textContent =
        "Поиск остановлен.";
    };
  </script>

  <script src="script.js"></script>

</body>
</html>
